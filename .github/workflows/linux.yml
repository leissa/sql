name: linux

on:
  push:
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: ${{matrix.compiler.name}} ${{matrix.build-type}}
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        compiler:
          # clang uses libstdc++ for its standard library, so g++-15 is installed in both cases.
          - { name: gcc-15, cc: gcc-15, cxx: g++-15,  apt: g++-15 }
          - { name: clang,  cc: clang,  cxx: clang++, apt: clang g++-15 }
        build-type: [Debug, Release]

    steps:
      - name: Clone recursively
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{matrix.compiler.apt}}

      - name: Configure
        run: CC=${{matrix.compiler.cc}} CXX=${{matrix.compiler.cxx}} cmake -S ${{github.workspace}} -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{matrix.build-type}} -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build ${{github.workspace}}/build

      - name: Test
        run: ctest --test-dir ${{github.workspace}}/build --output-on-failure

  sanitize:
    name: ASan+LSan+UBSan
    runs-on: ubuntu-26.04

    steps:
      - name: Clone recursively
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang g++-15

      - name: Configure
        run: >
          CC=clang CXX=clang++ cmake -S ${{github.workspace}} -B ${{github.workspace}}/build
          -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON
          -DCMAKE_CXX_FLAGS="-fsanitize=address,leak,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,leak,undefined"

      - name: Build
        run: cmake --build ${{github.workspace}}/build

      - name: Test
        run: ctest --test-dir ${{github.workspace}}/build --output-on-failure
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1

  install:
    name: install + find_package
    runs-on: ubuntu-26.04

    steps:
      - name: Clone recursively
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-15

      - name: Configure
        run: >
          CC=gcc-15 CXX=g++-15 cmake -S ${{github.workspace}} -B ${{github.workspace}}/build
          -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF

      - name: Build and install
        run: >
          cmake --build ${{github.workspace}}/build
          && cmake --install ${{github.workspace}}/build --prefix ${{github.workspace}}/prefix

      # example/ is a project of its own; here it stands in for any downstream find_package(sql).
      - name: Build example against the install
        run: >
          CC=gcc-15 CXX=g++-15 cmake -S ${{github.workspace}}/example -B ${{github.workspace}}/build-example
          -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=${{github.workspace}}/prefix
          && cmake --build ${{github.workspace}}/build-example

      - name: Run it
        run: ${{github.workspace}}/build-example/example
