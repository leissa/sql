name: format

on:
  push:
  pull_request:
    branches: [ main ]

jobs:
  clang-format:
    name: clang-format
    runs-on: ubuntu-latest

    steps:
      # No submodules: only this repository's own sources are checked.
      - name: Clone
        uses: actions/checkout@v4

      - name: Check formatting
        run: |
          files=$(git ls-files '*.cpp' '*.h')
          echo "$files"
          clang-format --dry-run --Werror $files
